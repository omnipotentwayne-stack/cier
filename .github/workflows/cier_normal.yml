name: 定時爬蟲

on:
  schedule:
    # 台灣時間早上 5:00 = UTC 前一天 21:00
    # 每月 1 號（前一天是上月月底）
    - cron: '0 21 31 1,3,5,7,8,10,12 *'   # 31天月份的1號
    - cron: '0 21 30 4,6,9,11 *'           # 30天月份的1號
    - cron: '0 21 28 2 *'                  # 2月的1號
    # 每月 11 號
    - cron: '0 21 10 * *'
    # 每月 21 號
    - cron: '0 21 20 * *'

  workflow_dispatch:   # 可手動觸發（測試用）

jobs:
  scrape-g1:
    name: G1 爬蟲
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝套件
        run: pip install selenium playwright requests beautifulsoup4 openpyxl
      - name: 安裝 Playwright
        run: playwright install chromium --with-deps
      - uses: browser-actions/setup-chrome@v1
      - name: 執行 G1
        env:
          EMAIL_SENDER:   ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python G1_normal.py

  scrape-g2:
    name: G2 爬蟲
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝套件
        run: pip install selenium requests beautifulsoup4 openpyxl python-dateutil webdriver-manager
      - uses: browser-actions/setup-chrome@v1
      - name: 執行 G2
        env:
          EMAIL_SENDER:   ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python G2_normal.py

  scrape-g3:
    name: G3 爬蟲
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝套件
        run: pip install selenium requests openpyxl pandas webdriver-manager
      - uses: browser-actions/setup-chrome@v1
      - name: 執行 G3
        env:
          EMAIL_SENDER:   ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python G3_normal.py

  scrape-g4:
    name: G4 爬蟲
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝套件
        run: pip install selenium requests openpyxl pandas pdfplumber PyPDF2 webdriver-manager
      - uses: browser-actions/setup-chrome@v1
      - name: 執行 G4
        env:
          EMAIL_SENDER:   ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python G4_normal.py

  scrape-g5:
    name: G5 爬蟲
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝套件
        run: pip install selenium requests beautifulsoup4 openpyxl pandas pdfplumber python-dateutil webdriver-manager
      - uses: browser-actions/setup-chrome@v1
      - name: 執行 G5
        env:
          EMAIL_SENDER:   ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python G5_normal.py
